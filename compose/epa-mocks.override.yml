# Anpassungen, um die ePA-Mocks von gematik (epa-deployment) auf einem Rechner mit 8 GB zu betreiben:
# Der Speicher jeder JVM ist begrenzt. Zu verwenden zusammen mit der Originaldatei:
#   docker compose -f epa-deployment/dc-mocks.yml -f epa-mocks.override.yml up -d <services>
services:
  medication-service:
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx640m
      # Der Rendering-Dienst der eML liest nur EINE Seite von MedicationRequest und filtert dann nach Patient:
      # Bei 20 Ergebnissen pro Seite (Standard) verdecken die Verordnungen anderer Patienten die des angefragten Patienten.
      - HAPI_FHIR_DEFAULT_PAGE_SIZE=500
      - HAPI_FHIR_MAX_PAGE_SIZE=500
  medication-render-service:
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
  information-service:
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
  entitlement-service:
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m
  authorization-service:
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
  vau-proxy-server:
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
  tiger-proxy:
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
