name: aicare

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [aicare]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.43.8
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5679/
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # Die Connector-Workflows berechnen SHA-256-Fingerabdrücke in Code-Knoten.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5679:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Vom Connector „Dateien“ überwachter Ordner (nur lesend). n8n 2 erlaubt das Lesen
      # von Dateien nur in ~/.n8n-files.
      - ../data/fichiers:/home/node/.n8n-files/fichiers:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [aicare]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "6335:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [aicare]

  # Ollama (Sprachmodell + Embedding-Modell). Standardmäßig verwendet das Projekt das AUF DEM RECHNER INSTALLIERTE Ollama (Port 11434):
  # nur eine Kopie der Modelle, und auf diesem Rechner mit 8 GB würde ein weiterer Container Speicher kosten. Dieser Dienst liegt daher im
  # Profil „ollama“: Er startet nicht mit `docker compose up -d`, sondern nur mit
  #     docker compose --profile ollama up -d
  # Er veröffentlicht denselben Port 11434: zuerst das Ollama des Rechners beenden. n8n ruft es bereits über host.docker.internal:11434 auf (nichts zu ändern).
  # Danach: docker compose exec ollama ollama pull llama3.2 && docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [aicare]

  # OCR (OCRmyPDF + Tesseract) für die gescannten PDFs des Connectors „Dateien“.
  ocr:
    build: ./ocr
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "8009:8000"
    networks: [aicare]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    networks: [aicare]

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      # Mailpit hat keinen IMAP-Server (nur SMTP und POP3): Es benachrichtigt n8n bei jedem neuen Brief per Webhook.
      # n8n liest die Nachricht anschließend über die API von Mailpit erneut; der Inhalt der Benachrichtigung wird nicht verwendet.
      MP_WEBHOOK_URL: http://n8n:5678/webhook/courrier-recu
      # Mailpit sendet nur EINE Benachrichtigung pro Sekunde und verwirft die folgenden: 5 auf einmal eingegangene Briefe = nur 1 Benachrichtigung.
      # Der geplante Nachlauf (Workflow 86, alle 2 Minuten) verarbeitet die übrigen. MP_WEBHOOK_LIMIT nicht einstellen: gemessen, ein
      # größerer Wert (50) lässt auch Nachrichten verloren gehen, die einige Sekunden auseinanderliegen.
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [aicare]

  hapi-fhir:
    image: hapiproject/hapi:v8.12.0-1
    restart: unless-stopped
    # Das Image läuft standardmäßig als nicht privilegierter Benutzer und kann nicht in das Volume schreiben
    # (H2-Datenbank): Wir starten es als root. Nur in der lokalen Entwicklung akzeptabel.
    user: "0:0"
    ports:
      - "8090:8080"
    volumes:
      - hapi_data:/data/hapi
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/hapi/h2
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
    networks: [aicare]

volumes:
  postgres_data:
  n8n_data:
  qdrant_data:
  mosquitto_data:
  hapi_data:
  ollama_data:

networks:
  aicare:
    driver: bridge
